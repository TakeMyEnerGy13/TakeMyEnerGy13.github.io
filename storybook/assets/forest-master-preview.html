<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лесная сцена — живая композиция 02</title>
  <link rel="stylesheet" href="forest-master.css">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#141119}
    body{min-height:100svh;display:grid;place-items:center}
    .composition{width:min(100vw,177.6833156svh)}
    .motion-toggle{position:fixed;right:14px;bottom:14px;z-index:3;width:40px;height:40px;border:1px solid #746353;border-radius:2px;background:#ddceb5;color:#30232b;box-shadow:2px 3px #110d16;font:18px Georgia,serif;cursor:pointer}
    .motion-toggle:focus-visible{outline:2px solid #ddceb5;outline-offset:4px}
    .motion-toggle:disabled{display:none}
  </style>
  <script src="forest-master-preview.js" defer></script>
  <script src="forest-master-motion.js" defer></script>
</head>
<body>
  <main class="composition still" role="img" aria-label="Живая ночная сказка: девушка покачивается на красных лентах, дьявольская тень танцует на тропинке, цветы, грибы и деревья моргают. Ветер несёт листья и туман. В церкви мерцают окна, между ветвями — звёздное небо с луной.">
    <svg class="sky" viewBox="0 0 1672 941" aria-hidden="true">
      <defs>
        <linearGradient id="night" x2=".3" y2="1">
          <stop stop-color="#3e304e"/>
          <stop offset=".42" stop-color="#705773"/>
          <stop offset="1" stop-color="#8b7085"/>
        </linearGradient>
        <radialGradient id="moon-air">
          <stop stop-color="#cfb994" stop-opacity=".16"/>
          <stop offset="1" stop-color="#cfb994" stop-opacity="0"/>
        </radialGradient>
        <filter id="sky-paper" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".17" numOctaves="3" seed="24" result="grain"/>
          <feColorMatrix in="grain" type="saturate" values="0" result="paper"/>
          <feComponentTransfer in="paper" result="texture"><feFuncA type="linear" slope=".25"/></feComponentTransfer>
          <feBlend in="SourceGraphic" in2="texture" mode="soft-light"/>
        </filter>
        <filter id="cloud-wash" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".005 .009" numOctaves="4" seed="7"/>
          <feColorMatrix values="0 0 0 0 .70  0 0 0 0 .59  0 0 0 0 .73  1.4 1.4 1.4 0 -1.8"/>
        </filter>
        <filter id="cloud-shadow" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".004 .008" numOctaves="3" seed="19"/>
          <feColorMatrix values="0 0 0 0 .17  0 0 0 0 .14  0 0 0 0 .24  1.2 1.2 1.2 0 -1.4"/>
        </filter>
        <filter id="moon-edge" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency=".07" numOctaves="2" seed="3" result="rough"/>
          <feDisplacementMap in="SourceGraphic" in2="rough" scale="1.9" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
      <path fill="url(#night)" d="M0 0H1672V941H0Z" filter="url(#sky-paper)"/>
      <ellipse cx="731" cy="137" rx="180" ry="160" fill="url(#moon-air)"/>
      <g class="cloud cloud-far" opacity=".56"><path d="M-100 -80H1800V941H-100Z" filter="url(#cloud-shadow)"/></g>
      <g class="stars"></g>
      <path d="M737 88C699 90 677 118 682 150C688 181 720 197 750 181C760 176 766 171 771 165C746 171 725 156 719 134C715 116 721 99 737 88Z" fill="#ead294" filter="url(#moon-edge)"/>
      <g class="cloud" opacity=".46"><path d="M-100 -80H1800V941H-100Z" filter="url(#cloud-wash)"/></g>
    </svg>
    <img class="plate" src="forest-living-open.webp" width="1672" height="941" alt="" fetchpriority="high">
    <canvas class="living-plate" aria-hidden="true"></canvas>
  </main>
  <button class="motion-toggle" data-scene-motion-toggle type="button" aria-label="Остановить движение" title="Остановить движение" aria-pressed="false">Ⅱ</button>
</body>
</html>
